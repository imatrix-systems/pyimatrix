[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyimatrix"
version = "0.0.1"
description = "Async Python client for the iMatrix Cloud integration API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "iMatrix Systems" }]
dependencies = ["aiohttp>=3.10"]
classifiers = [
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/imatrix-systems/pyimatrix"
Issues = "https://github.com/imatrix-systems/pyimatrix/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "aioresponses>=0.7.6", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyimatrix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=pyimatrix --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "PL", "RUF", "D"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "PLR2004"]
